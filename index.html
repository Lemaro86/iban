<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANI — Франшиза пиццерии на дровяных печах</title>
    <meta name="description"
          content="Франшиза BANI: готовый продукт с рейтингом 5.0, понятная экономика и полное сопровождение запуска точки.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Barlow+Condensed:wght@600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav" id="top">
    <a href="#hero" class="nav-logo" id="navLogo"><img src="img/logo.png"></a>
</header>

<div class="track" id="track">

    <!-- ============ HERO ============ -->
    <div class="panel panel-hero" id="hero">
        <div class="hero-bg"></div>
        <div class="hero-tint"></div>
        <div class="sticker-field" id="stickerField">
            <div class="sticker" data-drag style="top:11%;left:6%;">
                <img src="img/shrimp.png" alt="schrimp" width="200" height="200"/>
            </div>

            <div class="sticker" data-drag style="top:11%;left:20%;font-size: 56px">
                <img src="img/beer.png" alt="schrimp" height="200"/>
            </div>
            <div class="sticker sticker-lime" data-drag style="top:54%;left:78%;">
                <img src="img/bani.png" width="250">
            </div>
            <div class="sticker sticker-lime" data-drag style="top:6%;left:60%;">
                <img src="img/univ.png" width="250">
            </div>
            <div class="sticker hover-ex" data-drag style="top:16%;left:76%;">
                <img src="img/pizza.png" alt="schrimp" width="200" />
            </div>
            <div class="sticker logo" data-drag style="top:70%;left:45%;font-size:38px;">
                <img class="logob" src="img/logob.png" alt="Bani" height="200"/>
                <img class="logow" src="img/logow.png" alt="Bani" height="200"/>
            </div>
        </div>
        <div class="hero-inner">
            <div class="main-flex">
                <div class="main-left">
                    <img src="img/nobg.png" width="1000"/>
                    <p class="hero-lede">Пеперони / 4 Сыра / Маргарита / Диабола / С Тамбовским окороком и трюфмелем / С
                        Артишоками / Бри клюква</p>
                </div>
                <div class="main-right">
                    <div class="eyebrow"><b></b>Для топовых ценителей</div>
                    <h1 class="h1-swap">
                        <span class="line line-default"><span class="accent">BANI</span> · pizza & pasta</span>
                        <span class="line line-hover"><span class="accent">BANI</span> · pizza & pasta</span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                        <span class="spark"><img src="img/fire.gif"/></span>
                    </h1>
                    <div class="big-gallery">
                        <div class="img-rouletka">
                            <img src="img/girl.png" class="is-active" alt=""/>
                            <img src="img/bani1.png" alt=""/>
                            <img src="img/bani2.png" alt=""/>
                            <img src="img/bani3.png" alt=""/>
                            <img src="img/bani4.png" alt=""/>
                            <img src="img/bani5.png" alt=""/>
                            <video src="img/vid.mp4" muted playsinline preload="none"></video>
                        </div>
                        <div class="too-img">
                            <img src="img/bani1.png" width="500" alt=""/>
                        </div>
                    </div>

                </div>

                <!-- РЕЗЕРВ: сюда позже добавятся новые элементы, едем дальше по горизонтали -->
                <div class="hero-future"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.12.7/dist/gsap.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.12.7/dist/Draggable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.12.7/dist/InertiaPlugin.js"></script>
<script src="script.js"></script>
</body>
</html>
